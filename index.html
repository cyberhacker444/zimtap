<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AVIATOR BOT</title>

  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Loading Screen -->
  <div id="loader">
    <div class="loader-box">
      <!-- Aviator Plane (Neon Green) -->
      <svg class="aviator-plane-neon" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
        <!-- Fuselage -->
        <ellipse cx="100" cy="100" rx="15" ry="40" class="plane-body-neon"/>
        <!-- Cockpit -->
        <circle cx="100" cy="70" r="10" class="plane-cockpit-neon"/>
        <!-- Left Wing -->
        <polygon points="100,90 50,95 100,100" class="plane-wing-neon"/>
        <!-- Right Wing -->
        <polygon points="100,90 150,95 100,100" class="plane-wing-neon"/>
        <!-- Left Tail -->
        <polygon points="100,136 80,144 95,140" class="plane-tail-neon"/>
        <!-- Right Tail -->
        <polygon points="100,136 120,144 105,140" class="plane-tail-neon"/>
        <!-- Vertical Stabilizer -->
        <polygon points="100,136 100,156 104,144" class="plane-stabilizer-neon"/>
        <!-- Propeller -->
        <circle cx="100" cy="70" r="8" class="plane-propeller-neon"/>
      </svg>

      <h1>Aviator</h1>
      <p>Cash out everyday</p>

      <!-- Progress Bar -->
      <div class="progress-container">
        <div class="progress-bar" id="progressBar"></div>
      </div>
      <p class="progress-text" id="progressText">0%</p>

      <button id="continueBtn" disabled>Continue</button>
    </div>
  </div>

  <!-- Wrapper -->
  <div id="appWrapper">

    <!-- Neon Border Line -->
    <div class="neon-border"></div>

    <iframe
      src="https://aviatorpredictorbot.base44.app"
      id="siteFrame"
      frameborder="0"
      allowfullscreen>
    </iframe>

    <!-- Permanent Bottom Bar -->
    <div class="bottom-cover"></div>

  </div>

  <script src="script.js"></script>
</body>
</html>
