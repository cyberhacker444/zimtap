<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AVIATOR BOT</title>

  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Loading Screen -->
  <div id="loader">
    <div class="loader-box">
      <!-- Aviator Plane -->
      <svg class="aviator-plane" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
        <!-- Fuselage -->
        <ellipse cx="50" cy="50" rx="8" ry="20" class="plane-body"/>
        <!-- Cockpit -->
        <circle cx="50" cy="35" r="5" class="plane-cockpit"/>
        <!-- Left Wing -->
        <polygon points="50,45 25,48 50,50" class="plane-wing"/>
        <!-- Right Wing -->
        <polygon points="50,45 75,48 50,50" class="plane-wing"/>
        <!-- Left Tail -->
        <polygon points="50,68 40,72 48,70" class="plane-tail"/>
        <!-- Right Tail -->
        <polygon points="50,68 60,72 52,70" class="plane-tail"/>
        <!-- Vertical Stabilizer -->
        <polygon points="50,68 50,78 52,72" class="plane-stabilizer"/>
      </svg>

      <h1>AVIATOR BOT</h1>
      <p>Cash out everyday</p>

      <!-- Progress Bar -->
      <div class="progress-container">
        <div class="progress-bar" id="progressBar"></div>
      </div>
      <p class="progress-text" id="progressText">0%</p>

      <button id="continueBtn" disabled>Continue</button>
    </div>
  </div>

  <!-- Wrapper -->
  <div id="appWrapper">

    <!-- Neon Border Line -->
    <div class="neon-border"></div>

    <iframe
      src="https://aviatorpredictorbot.base44.app"
      id="siteFrame"
      frameborder="0"
      allowfullscreen>
    </iframe>

    <!-- Permanent Bottom Bar -->
    <div class="bottom-cover"></div>

  </div>

  <script src="script.js"></script>
</body>
</html>
