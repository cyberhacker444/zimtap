<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AVIATOR</title>

  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Loading Screen -->
  <div id="loader">
    <div class="loader-box">
      <!-- Aviator Plane SVG - Exact replica in green neon -->
      <svg class="aviator-plane-exact" viewBox="0 0 200 150" xmlns="http://www.w3.org/2000/svg">
        <!-- Main fuselage body -->
        <path d="M 100 30 Q 95 50 95 80 L 95 120 Q 100 130 105 120 L 105 80 Q 105 50 100 30" class="plane-fuselage"/>
        
        <!-- Cockpit/nose cone -->
        <ellipse cx="100" cy="25" rx="8" ry="12" class="plane-nose"/>
        
        <!-- Left main wing -->
        <path d="M 95 70 L 30 75 L 40 80 L 100 75 Z" class="plane-wing"/>
        
        <!-- Right main wing -->
        <path d="M 105 70 L 170 75 L 160 80 L 100 75 Z" class="plane-wing"/>
        
        <!-- Left aileron/small wing -->
        <path d="M 92 85 L 50 88 L 52 92 L 94 90 Z" class="plane-aileron"/>
        
        <!-- Right aileron/small wing -->
        <path d="M 108 85 L 150 88 L 148 92 L 106 90 Z" class="plane-aileron"/>
        
        <!-- Vertical tail fin -->
        <polygon points="100,115 98,145 102,145" class="plane-tail"/>
        
        <!-- Horizontal tail wing left -->
        <polygon points="95,120 70,125 75,130 100,125" class="plane-tail-wing"/>
        
        <!-- Horizontal tail wing right -->
        <polygon points="105,120 130,125 125,130 100,125" class="plane-tail-wing"/>
      </svg>

      <h1>Aviator</h1>

      <!-- Progress Bar -->
      <div class="progress-container">
        <div class="progress-bar" id="progressBar"></div>
      </div>
      <p class="progress-text" id="progressText">0%</p>

      <button id="continueBtn" disabled>Continue</button>
    </div>
  </div>

  <!-- Wrapper -->
  <div id="appWrapper">

    <!-- Neon Border Line -->
    <div class="neon-border"></div>

    <iframe
      src="https://aviatorpredictorbot.base44.app"
      id="siteFrame"
      frameborder="0"
      allowfullscreen>
    </iframe>

    <!-- Permanent Bottom Bar -->
    <div class="bottom-cover"></div>

  </div>

  <script src="script.js"></script>
</body>
</html>
